name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, beta, public-release]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: php-parallel-lint/php-parallel-lint
      - run: parallel-lint --exclude vendor .

  test:
    name: Test
    needs: lint
    runs-on: [self-hosted, beta, public-release]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit
