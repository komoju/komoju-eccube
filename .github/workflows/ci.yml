name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: php-parallel-lint/php-parallel-lint
      - run: parallel-lint --exclude vendor .

  test:
    name: Unit tests / PHP ${{ matrix.php }}
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit

  compatibility:
    name: EC-CUBE ${{ matrix.eccube }}
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - eccube: '4.2.3'
            php: '7.4'
          - eccube: '4.3.1'
            php: '8.1'
    services:
      mailcatcher:
        image: sj26/mailcatcher@sha256:572048324658d2198e0a96785cca4f0260f2c4cadb2cb057bd837b9ee0c60533 # 0.11.0
        ports:
          - 127.0.0.1:1025:1025
          - 127.0.0.1:1080:1080
        options: >-
          --health-cmd "ruby -rsocket -e '[1025,1080].each { |port| TCPSocket.new(%q{127.0.0.1}, port).close }'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      APP_DEBUG: '0'
      DATABASE_URL: sqlite:////tmp/komoju-order-confirmation.sqlite
      DATABASE_SERVER_VERSION: '3'
      DATABASE_CHARSET: utf8
      MAILER_DSN: smtp://127.0.0.1:1025
      MAILCATCHER_URL: http://127.0.0.1:1080
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Package before checking out EC-CUBE so its source cannot enter the archive.
      - name: Build plugin archive
        run: bash .github/scripts/build-plugin-archive.sh staging "$RUNNER_TEMP/Komoju42.tar.gz"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: EC-CUBE/ec-cube
          ref: ${{ matrix.eccube }}
          persist-credentials: false
          path: ec-cube
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, pdo_sqlite, zip
      - name: Install EC-CUBE and plugin
        working-directory: ec-cube
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php bin/console doctrine:database:create
          php bin/console doctrine:schema:create
          php bin/console eccube:fixtures:load
          php bin/console eccube:plugin:install --code=Komoju42 --path="$RUNNER_TEMP/Komoju42.tar.gz"
          php bin/console cache:clear --no-warmup
          php bin/console eccube:plugin:enable --code=Komoju42
          php bin/console cache:warmup
      - name: Verify order confirmations
        working-directory: ec-cube
        run: php "$GITHUB_WORKSPACE/tests/integration/order_confirmation.php"
