name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, beta, public-release]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          tools: php-parallel-lint/php-parallel-lint
      - run: parallel-lint --exclude vendor .

  test:
    name: Unit tests / PHP ${{ matrix.php }}
    needs: lint
    runs-on: [self-hosted, beta, public-release]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit

  compatibility:
    name: EC-CUBE ${{ matrix.eccube }}
    needs: lint
    runs-on: [self-hosted, beta, public-release]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - eccube: '4.2.3'
            php: '7.4'
          - eccube: '4.3.1'
            php: '8.1'
    env:
      APP_ENV: test
      APP_DEBUG: 0
      DATABASE_URL: 'sqlite:///%kernel.project_dir%/var/eccube.db'
      DATABASE_SERVER_VERSION: '3'
      DATABASE_CHARSET: utf8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, pdo_sqlite, zip
      - name: Build plugin archive
        run: bash .github/scripts/build-plugin-archive.sh staging "$RUNNER_TEMP/Komoju42.tar.gz"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: EC-CUBE/ec-cube
          ref: ${{ matrix.eccube }}
          persist-credentials: false
          path: ec-cube
      - name: Install EC-CUBE
        working-directory: ec-cube
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          bin/console doctrine:database:create
          bin/console doctrine:schema:create
          bin/console eccube:fixtures:load
      - name: Install and enable plugin
        working-directory: ec-cube
        run: |
          bin/console eccube:plugin:install --code=Komoju42 --path="$RUNNER_TEMP/Komoju42.tar.gz"
          bin/console cache:clear --no-warmup
          bin/console eccube:plugin:enable --code=Komoju42
          bin/console cache:warmup
