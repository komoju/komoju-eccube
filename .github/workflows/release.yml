name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.3.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Plugin Archive
    runs-on: [self-hosted, beta, public-release]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      archive_name: ${{ steps.meta.outputs.archive_name }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'

      - name: Determine version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid version: %q\n' "$VERSION" >&2
            exit 1
          fi

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'archive_name=%s\n' 'Komoju42' >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "Komoju42-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin archive
        env:
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive_name }}
        run: bash .github/scripts/build-plugin-archive.sh staging "$RUNNER_TEMP/$ARCHIVE_NAME.tar.gz"

      - name: Verify archive can be extracted by PharData
        env:
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/phartest"
          php -r "\$p = new PharData(getenv('RUNNER_TEMP') . '/' . getenv('ARCHIVE_NAME') . '.tar.gz'); \$p->extractTo(getenv('RUNNER_TEMP') . '/phartest', null, true); echo \"PharData extraction OK\\n\";"

      - name: Upload verified archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.meta.outputs.archive_name }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, beta, public-release]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ needs.build.outputs.archive_name }} v${{ needs.build.outputs.version }}
          files: ${{ runner.temp }}/${{ needs.build.outputs.archive_name }}.tar.gz
