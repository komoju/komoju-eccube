name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.3.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Plugin Archive
    runs-on: [self-hosted, beta, public-release]
    steps:
      - uses: actions/checkout@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v4
      - uses: shivammathur/setup-php@11d5960a326750d5838078e36cf38b85af677262 # v2
        with:
          php-version: '8.1'

      - name: Determine version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid version: %q\n' "$VERSION" >&2
            exit 1
          fi

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'zip_name=%s\n' 'Komoju42' >> "$GITHUB_OUTPUT"

      - name: Prepare plugin directory
        run: |
          # NOTE: --exclude='vendor' is required. EC-CUBE's plugin loader
          # auto-discovers services under app/Plugin/*/**/*.php; if vendor/
          # ships with the archive it tries to register vendor/autoload.php
          # as a Plugin\<Name>\vendor\autoload service class and the entire
          # admin panel breaks with "Expected to find class ... in file ...
          # vendor/autoload.php".
          mkdir -p staging
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='staging' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='phpunit.xml.dist' \
            --exclude='.phpunit.result.cache' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='README.md' \
            --exclude='README.txt' \
            --exclude='CHANGELOG.txt' \
            --exclude='TECHNICAL.md' \
            --exclude='LICENSE.txt' \
            --exclude='composer.lock' \
            ./ staging/

      - name: Build archives (for GitHub Release)
        env:
          ARCHIVE_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          # EC-CUBE requires a ustar archive without a root `./` entry.
          cd staging
          tar --format=ustar -czf "../$ARCHIVE_NAME.tar.gz" -- *

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}-${{ steps.meta.outputs.version }}
          path: staging/*

      - name: Verify archive can be extracted by PharData
        env:
          ARCHIVE_NAME: ${{ steps.meta.outputs.zip_name }}
        # PharData is what EC-CUBE uses on the merchant's server to unpack
        # the .tar.gz upload. If our archive can't be extracted by PharData
        # the merchant sees a generic "プラグインのアップロードに失敗しました。".
        # Better to fail the release here than ship a broken tarball.
        run: |
          mkdir -p phartest
          php -r "\$p = new PharData(getenv('ARCHIVE_NAME') . '.tar.gz'); \$p->extractTo('phartest', null, true); echo \"PharData extraction OK\\n\";"
          rm -rf phartest

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          name: ${{ steps.meta.outputs.zip_name }} v${{ steps.meta.outputs.version }}
          files: |
            ${{ steps.meta.outputs.zip_name }}.tar.gz
