services:
    plg_Komoju.service.config:
        public: true
        class: Plugin\Komoju\Service\ConfigService
        arguments:
            - '@Doctrine\ORM\EntityManagerInterface'
            - '@Eccube\Common\EccubeConfig'
    plg_Komoju.service.komoju_log:
        public: true
        class: Plugin\Komoju\Service\LogService
        arguments:
            - '@Doctrine\ORM\EntityManagerInterface'
    plg_Komoju.service.komoju_webhook:
        public: true
        class: Plugin\Komoju\Service\WebhookService
        arguments:
            - '@Doctrine\ORM\EntityManagerInterface'
            - '@Eccube\Service\OrderStateMachine'
            - '@plg_Komoju.service.komoju_log'
    plg_Komoju.service.komoju_mail_service:
        public: true
        class: Plugin\Komoju\Service\MailExService
        arguments:
            - '@Doctrine\ORM\EntityManagerInterface'
            - '@swiftmailer.mailer.default'
            - '@Eccube\Repository\MailTemplateRepository'
            - '@Eccube\Repository\MailHistoryRepository'
            - '@Eccube\Repository\BaseInfoRepository'
            - '@Symfony\Component\EventDispatcher\EventDispatcherInterface'
            - '@twig'
            - '@Eccube\Common\EccubeConfig'
    plg_Komoju.service.komoju_service:
        public: true
        class: Plugin\Komoju\Service\KomojuService
        arguments:
            - '@Doctrine\ORM\EntityManagerInterface'
            - '@plg_Komoju.service.config'

    Plugin\Komoju\Controller\SessionReturnController:
        public: true
        class: Plugin\Komoju\Controller\SessionReturnController
        arguments:
            - '@Doctrine\ORM\EntityManagerInterface'
            - '@plg_Komoju.service.config'
            - '@plg_Komoju.service.komoju_log'
            - '@eccube.purchase.flow.shopping'
        tags: ['controller.service_arguments']

    # FQCN aliases for type-hinted injection
    Plugin\Komoju\Service\ConfigService: '@plg_Komoju.service.config'
    Plugin\Komoju\Service\LogService: '@plg_Komoju.service.komoju_log'
    Plugin\Komoju\Service\WebhookService: '@plg_Komoju.service.komoju_webhook'
    Plugin\Komoju\Service\MailExService: '@plg_Komoju.service.komoju_mail_service'
    Plugin\Komoju\Service\KomojuService: '@plg_Komoju.service.komoju_service'
